"La prise de licence impliquera l'adhésion automatique aux statuts, règlement intérieur et politique financière du club. La charte d'interclub sera à signer pour les joueurs s'engageant pour une équipe du club. Depuis juillet 2024, il n'est plus nécessaire de fournir un certificat médical. Un questionnaire de santé est à remplir directement lors de l'adhésion en ligne. Cependant, si l'une des cases est cochée OUI, un certificat médical de moins de 6 mois vous sera demandé (seul le certificat médical de la FFBAD sera valable).": "Taking out a license will involve automatic acceptance of the club's statutes, internal regulations and financial policy. The inter-club charter must be signed by players joining a club team. Since July 2024, it is no longer necessary to provide a medical certificate. A health questionnaire must be completed directly during online registration. However, if one of the boxes is checked YES, a medical certificate less than 6 months old will be required (only the FFBAD medical certificate will be valid)."
